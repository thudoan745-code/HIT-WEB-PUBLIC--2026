<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Khóa học Front-end</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style3.css">

</head>
<body>

    <h1>KHÓA HỌC FRONT-END</h1>

    <div class="container">

        <div class="card">
            <i class="fa-brands fa-html5 icon"></i>

            <h2>HTML5</h2>

            <p>
                Học cách tạo cấu trúc cho một trang web bằng HTML5.
            </p>

            <button>Chi tiết</button>
        </div>

        <div class="card">
            <i class="fa-brands fa-css3-alt icon"></i>

            <h2>CSS3</h2>

            <p>
                Thiết kế giao diện đẹp và tạo hiệu ứng bằng CSS3.
            </p>

            <button>Chi tiết</button>
        </div>

        <div class="card">
            <i class="fa-brands fa-js icon"></i>

            <h2>JavaScript</h2>

            <p>
                Thêm tính năng và xử lý các chức năng cho website.
            </p>

            <button>Chi tiết</button>
        </div>

    </div>
